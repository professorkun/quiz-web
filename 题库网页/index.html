<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#3b6ef5">
<title>JavaWeb 期末题库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f5f7; --card:#ffffff; --pri:#3b6ef5; --pri-l:#eef3ff;
  --tx:#1b1f26; --sub:#6b7280; --line:#e9ecf1;
  --ok:#16a34a; --ok-l:#e9f7ef; --no:#dc2626; --no-l:#fdecec;
  --warn:#b45309; --warn-l:#fdf6e7;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
/* 顶栏 */
.hd{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.hd h1{font-size:17px; font-weight:700; letter-spacing:.2px}
.hd p{font-size:12px; color:var(--sub); margin-top:2px}
/* 底部标签栏 */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; text-align:center; padding:9px 0 8px; font-size:12px; color:var(--sub);
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
}
.tab .ic{font-size:19px; line-height:1}
.tab.on{color:var(--pri); font-weight:600}
/* 通用 */
.wrap{padding:12px 12px 20px}
.card{background:var(--card); border-radius:14px; box-shadow:0 1px 2px rgba(16,24,40,.04); overflow:hidden}
.pad{padding:14px}
.muted{color:var(--sub); font-size:12.5px}
.hr{height:1px; background:var(--line); margin:12px 0}
/* 搜索 */
.search{position:relative; margin-bottom:10px}
.search input{
  width:100%; height:42px; border:none; border-radius:11px; background:var(--card);
  padding:0 14px 0 38px; font-size:15px; color:var(--tx); outline:none;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.search .mag{position:absolute; left:13px; top:11px; font-size:15px; color:#9aa1ad}
.search .clr{position:absolute; right:10px; top:8px; width:26px; height:26px; border-radius:50%;
  background:#eceef2; color:#7b8291; font-size:14px; display:none; align-items:center; justify-content:center}
/* 筛选 chips */
.chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; height:31px; line-height:31px; padding:0 13px; border-radius:16px;
  background:#fff; color:#4b5563; font-size:13px; border:1px solid var(--line); cursor:pointer;
}
.chip.on{background:var(--pri); color:#fff; border-color:var(--pri); font-weight:600}
.cnt{font-size:12px; color:var(--sub); margin:2px 2px 8px; display:flex; justify-content:space-between}
/* 题目卡 */
.q{background:var(--card); border-radius:13px; margin-bottom:9px; box-shadow:0 1px 2px rgba(16,24,40,.04)}
.qh{display:flex; gap:9px; padding:13px 13px; cursor:pointer; align-items:flex-start}
.tag{
  flex:0 0 auto; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px;
  background:var(--pri-l); color:var(--pri); margin-top:2px; letter-spacing:.3px;
}
.tag.j{background:#eaf4ff; color:#1f6feb}
.tag.f{background:#f3edff; color:#7c3aed}
.tag.s{background:#fff2e8; color:#c2410c}
.tag.a{background:#e8f7f1; color:#0f766e}
.qt{flex:1; font-size:14.5px; line-height:1.6; word-break:break-word}
.qt .no{font-weight:700; margin-right:3px}
.meta{font-size:11.5px; color:#9aa1ad; margin-top:4px}
.qb{display:none; padding:0 13px 13px; border-top:1px dashed var(--line)}
.q.open .qb{display:block}
.opt{display:flex; gap:8px; padding:7px 0; font-size:14px; align-items:flex-start}
.opt .k{flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:#f1f3f6;
  color:#5b6472; font-size:12px; font-weight:700; text-align:center; line-height:20px; margin-top:2px}
.opt.ok .k{background:var(--ok); color:#fff}
.opt.ok{color:var(--ok); font-weight:600}
.judgebox{display:flex; gap:10px; margin-top:6px}
.jb{flex:1; text-align:center; padding:11px; border-radius:10px; background:#f6f7f9; font-weight:600; color:#4b5563}
.jb.ok{background:var(--ok-l); color:var(--ok)}
/* 答案解析 */
.ans{margin-top:11px; background:var(--pri-l); border-radius:10px; padding:11px 12px}
.ans .lb{font-size:12px; color:var(--pri); font-weight:700; margin-bottom:5px}
.ans .v{font-size:14.5px; font-weight:700; color:#1e3a8a; word-break:break-all}
.anl{margin-top:8px; background:#f8f9fb; border-radius:10px; padding:10px 12px; font-size:13.5px; color:#3f4753}
.anl b{color:#111}
/* 代码 */
pre{
  background:#f6f7f9; border:1px solid var(--line); border-radius:10px;
  padding:10px 11px; overflow-x:auto; margin:8px 0; -webkit-overflow-scrolling:touch;
}
pre code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px; line-height:1.62; color:#24292f; white-space:pre; display:block}
pre code .c{color:#6a737d}
pre code .hl{background:#fff3bf; border-radius:3px; padding:0 3px; color:#8a5a00; font-weight:700}
details{margin:8px 0}
details>summary{
  list-style:none; cursor:pointer; font-size:13px; color:var(--pri); font-weight:600;
  background:var(--pri-l); border-radius:9px; padding:9px 12px; position:relative;
}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾"; position:absolute; right:12px; top:9px; font-size:11px; color:var(--pri)}
details[open]>summary::after{content:"▴"}
/* 表格 */
.tbl{width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--line); padding:6px 7px; text-align:left; vertical-align:top}
.tbl th{background:#f7f8fa; font-weight:600; color:#4b5563}
.tbl td{word-break:break-all}
/* 填空输入 */
.blankin{
  display:inline-block; min-width:88px; max-width:100%; height:30px; line-height:30px;
  border:none; border-bottom:1.6px solid var(--pri); background:#f8faff;
  border-radius:5px 5px 0 0; padding:0 7px; font-size:14px; color:#1e3a8a;
  text-align:center; outline:none; vertical-align:baseline; margin:0 2px;
}
.blankin.right{background:var(--ok-l); border-color:var(--ok); color:#0f7a3d}
.blankin.wrong{background:var(--no-l); border-color:var(--no); color:#b91c1c}
.bl{display:inline-block; min-width:70px; border-bottom:1.6px solid #9aa1ad; margin:0 2px}
/* 模考 */
.hero{background:linear-gradient(135deg,#3b6ef5,#5b8bff); color:#fff; border-radius:16px; padding:20px 18px}
.hero h2{font-size:19px; font-weight:700; margin-bottom:6px}
.hero p{font-size:13px; opacity:.92; line-height:1.7}
.hero .row{display:flex; gap:9px; margin-top:15px}
.btn{
  border:none; border-radius:11px; font-size:15px; font-weight:600; padding:12px 18px;
  background:var(--pri); color:#fff; cursor:pointer; flex:1;
}
.btn.ghost{background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.5)}
.btn.gray{background:#eff1f5; color:#3f4753}
.btn:disabled{opacity:.55}
.btnrow{display:flex; gap:10px; margin-top:14px}
.plan{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:14px}
.plan .it{background:#fff; border-radius:11px; padding:11px 12px; box-shadow:0 1px 2px rgba(16,24,40,.04)}
.plan .it b{font-size:17px; color:var(--pri)}
.plan .it span{display:block; font-size:11.5px; color:var(--sub); margin-top:1px}
/* 考试头 */
.exhd{
  position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:9px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.exhd .t{font-size:13.5px; font-weight:600}
.exhd .s{font-size:12px; color:var(--sub); margin-top:1px}
.exhd .tm{font-variant-numeric:tabular-nums; font-size:14px; font-weight:700; color:var(--pri); white-space:nowrap}
/* 试卷题目 */
.pq{background:#fff; border-radius:13px; margin-bottom:10px; padding:14px 13px}
.pq .phead{display:flex; justify-content:space-between; gap:8px; margin-bottom:8px}
.pq .phead .l{font-size:12px; color:var(--sub)}
.pq .phead .r{font-size:12px; color:var(--pri); font-weight:700}
.pstem{font-size:15px; line-height:1.65; word-break:break-word}
.opts{margin-top:8px}
.optbtn{
  display:flex; gap:9px; padding:11px 12px; border:1px solid var(--line); border-radius:11px;
  margin-bottom:8px; font-size:14px; background:#fff; cursor:pointer; align-items:flex-start;
}
.optbtn>span:last-child{word-break:break-word;min-width:0}
.optbtn .k{flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:#f1f3f6;
  color:#5b6472; font-size:12.5px; font-weight:700; text-align:center; line-height:22px}
.optbtn.sel{border-color:var(--pri); background:var(--pri-l)}
.optbtn.sel .k{background:var(--pri); color:#fff}
.optbtn.ok{border-color:var(--ok); background:var(--ok-l)}
.optbtn.ok .k{background:var(--ok); color:#fff}
.optbtn.no{border-color:var(--no); background:var(--no-l)}
.optbtn.no .k{background:var(--no); color:#fff}
.tf{display:flex; gap:10px}
.tfb{
  flex:1; text-align:center; padding:12px; border:1px solid var(--line); border-radius:11px;
  font-size:15px; font-weight:600; background:#fff; cursor:pointer;
}
.tfb.sel{border-color:var(--pri); background:var(--pri-l); color:var(--pri)}
.tfb.ok{border-color:var(--ok); background:var(--ok-l); color:var(--ok)}
.tfb.no{border-color:var(--no); background:var(--no-l); color:var(--no)}
textarea{
  width:100%; min-height:88px; border:1px solid var(--line); border-radius:10px; padding:10px;
  font-size:14px; font-family:inherit; line-height:1.6; outline:none; resize:vertical; background:#fcfcfd;
}
textarea:focus{border-color:var(--pri)}
/* 结果 */
.result{background:#fff; border-radius:15px; padding:18px 16px; text-align:center; margin-bottom:12px}
.result .sc{font-size:44px; font-weight:800; color:var(--pri); line-height:1.1; font-variant-numeric:tabular-nums}
.result .sc small{font-size:15px; color:var(--sub); font-weight:600}
.result .lv{font-size:14px; margin-top:6px; color:var(--sub)}
.brk{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:14px; text-align:left}
.brk .b{background:#f8f9fb; border-radius:9px; padding:9px 11px; font-size:12.5px; color:#4b5563}
.brk .b b{color:var(--tx)}
.self{display:flex; gap:7px; margin-top:9px}
.self button{
  flex:1; padding:9px; border:1px solid var(--line); border-radius:9px; background:#fff;
  font-size:12.5px; color:#4b5563; cursor:pointer;
}
.self button.on{background:var(--pri); color:#fff; border-color:var(--pri); font-weight:600}
.self button.on.ok{background:var(--ok); border-color:var(--ok)}
.self button.on.half{background:var(--warn); border-color:var(--warn)}
.self button.on.no{background:var(--no); border-color:var(--no)}
.empty{text-align:center; padding:56px 20px; color:var(--sub); font-size:14px}
.empty .e{font-size:38px; margin-bottom:10px; opacity:.5}
.foot{text-align:center; font-size:11.5px; color:#a8aeb9; padding:18px 0 8px}
/* 我的 / 云服务 */
.lh{display:flex; gap:11px; align-items:flex-start; margin-bottom:14px}
.lic{font-size:22px; line-height:1.2}
.lt{font-size:15.5px; font-weight:700}
.field{margin-bottom:12px}
.field label{display:block; font-size:12.5px; color:var(--sub); margin-bottom:5px}
.field input{
  width:100%; height:44px; border:1px solid var(--line); border-radius:11px; padding:0 13px;
  font-size:16px; color:var(--tx); background:#fcfcfd; outline:none;
}
.field input:focus{border-color:var(--pri); background:#fff}
.frow{display:flex; gap:8px; align-items:center}
.frow input{flex:1; min-width:0}
.btn.mini{
  flex:0 0 auto; width:auto; padding:0 13px; height:44px; font-size:13.5px; border-radius:11px;
  background:var(--pri-l); color:var(--pri); font-weight:600;
}
.btn.mini:disabled{color:var(--sub); background:#f1f3f6}
.ferr{font-size:12px; color:var(--no); margin-top:5px}
.err{background:var(--no-l); color:#b91c1c; border-radius:9px; padding:9px 11px; font-size:13px; margin-bottom:12px}
.or{display:flex; align-items:center; gap:10px; margin:14px 0; color:#a8aeb9; font-size:12px}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--line)}
.btn.wx{background:#07c160; color:#fff; width:100%}
.userbox{display:flex; align-items:center; gap:12px}
.avatar{
  flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:var(--pri-l); color:var(--pri);
  font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center;
}
.uinfo{flex:1; min-width:0}
.uname{font-size:15.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.linkbtn{border:none; background:none; color:var(--sub); font-size:13px; padding:6px 2px; cursor:pointer}
.chead{display:flex; justify-content:space-between; align-items:baseline; padding:12px 13px 8px; font-size:14px}
.cempty{text-align:center; color:var(--sub); font-size:13px; padding:22px 16px}
.rec{display:flex; gap:12px; align-items:center; padding:11px 13px; border-top:1px solid var(--line)}
.rsc{flex:0 0 auto; width:52px; font-size:22px; font-weight:800; color:var(--pri); text-align:center; font-variant-numeric:tabular-nums}
.rsc small{font-size:11px; color:var(--sub); font-weight:600; margin-left:1px}
.rinfo{flex:1; min-width:0; font-size:13px}
.wr{padding:11px 13px; border-top:1px solid var(--line); cursor:pointer}
.wr:active{background:#fafbfc}
.wrq{display:flex; gap:7px; align-items:flex-start; font-size:13.5px; line-height:1.55}
.wrq .tag{margin-top:2px}
.wrm{font-size:11.5px; color:#9aa1ad; margin-top:4px; padding-left:2px}
.savehint{font-size:12.5px; color:var(--sub); margin-top:10px; min-height:18px}
.savehint a{color:var(--pri); text-decoration:underline}
/* 进度条 */
.progcard{margin-bottom:10px}
.progtop{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; font-size:14px}
.progtop b{font-weight:700}
.pbar{height:7px; border-radius:4px; background:#eef0f4; overflow:hidden}
.pbar i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#3b6ef5,#5b8bff); transition:width .35s}
.prow{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:12.5px; color:#4b5563}
.prow>span{flex:0 0 30px}
.prow .pbar{flex:1}
.prow>b{flex:0 0 52px; text-align:right; font-weight:600; color:var(--tx); font-variant-numeric:tabular-nums}
.btn.block{width:100%}
/* 刷题（一题一页） */
.tabs.six .tab{padding:8px 0 7px; font-size:11px}
.tabs.six .tab .ic{font-size:17px}
.dprog{height:4px; background:#eef0f4; margin:0 14px}
.dprog i{display:block; height:100%; background:linear-gradient(90deg,#3b6ef5,#5b8bff); transition:width .25s}
.dstat{display:flex; gap:16px; font-size:12.5px; color:var(--sub); margin:10px 3px 0}
.dstat b{color:var(--tx); font-variant-numeric:tabular-nums}
.optbtn.dis{cursor:default; opacity:.96}
.qmeta{font-size:12px; color:#9aa1ad; margin-top:6px}
/* 知识点 */
.kbcard{margin-bottom:10px; padding:14px 13px}
.kbcard .h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.kbcard h3{font-size:15.5px; font-weight:700}
.kbcard .d{font-size:13px; color:#4b5563; margin-top:5px; line-height:1.6}
.kbcard .m{font-size:11.5px; color:#9aa1ad; margin-top:7px}
.pt{display:flex; gap:9px; padding:11px 0; border-bottom:1px dashed var(--line)}
.pt:last-child{border-bottom:none; padding-bottom:2px}
.pt .n{flex:0 0 22px; height:22px; border-radius:50%; background:var(--pri-l); color:var(--pri);
  font-size:11.5px; font-weight:700; text-align:center; line-height:22px; margin-top:1px}
.pt .t{font-size:14px; font-weight:600; line-height:1.5}
.pt .d{font-size:13px; color:#4b5563; margin-top:3px; line-height:1.65}
.pit{background:var(--warn-l); border-radius:10px; padding:10px 12px; margin-top:12px; font-size:13px; color:#8a5a00}
.pit b{display:block; margin-bottom:4px}
.pit li{margin:4px 0 0 16px; line-height:1.6}
@media (min-width:640px){
  .wrap{max-width:720px; margin:0 auto}
  .hd{padding-left:calc(50% - 348px); padding-right:calc(50% - 348px)}
}
</style>
</head>
<body>

<header class="hd" id="hd">
  <h1>JavaWeb 期末题库</h1>
  <p id="hdsub">选择 62 · 判断 45 · 填空 27 · 简答 8 · 应用 5</p>
</header>

<main class="wrap" id="app"></main>

<nav class="tabs six">
  <div class="tab on" data-tab="bank"><span class="ic">📚</span><span>题库</span></div>
  <div class="tab" data-tab="drill"><span class="ic">🎯</span><span>刷题</span></div>
  <div class="tab" data-tab="exam"><span class="ic">📝</span><span>模考</span></div>
  <div class="tab" data-tab="wrong"><span class="ic">📕</span><span>错题</span></div>
  <div class="tab" data-tab="kb"><span class="ic">💡</span><span>知识</span></div>
  <div class="tab" data-tab="me"><span class="ic">👤</span><span>我的</span></div>
</nav>

     "text": "// 包声明：这个 Servlet 放在 com.servlet 包下\npackage com.servlet;\n\n// 异常类：方法签名里 throws 要用到\nimport java.io.IOException;\n\n// 输出流类：往浏览器写内容用\nimport java.io.PrintWriter;\n\n// Servlet 异常类，方法签名里要声明\nimport javax.servlet.ServletException;\n\n// 注解类：用它配置访问路径，替代 web.xml\nimport javax.servlet.annotation.WebServlet;\n\n// 父类：继承它才能直接重写 doGet / doPost\nimport javax.servlet.http.HttpServlet;\n\n// 请求对象类型：doGet 的第一个参数\nimport javax.servlet.http.HttpServletRequest;\n\n// 响应对象类型：doGet 的第二个参数\nimport javax.servlet.http.HttpServletResponse;\n\n// 注解配置访问路径，必须以 / 开头；等价于 web.xml 里的 <url-pattern>\n@WebServlet(\"/PageHitCounter\")\n\n// 继承 HttpServlet（不是 implements）；Servlet 是单实例、多线程的\npublic class PageHitCounter extends HttpServlet {\n\n    // 成员变量，不是局部变量：所有请求共享它，计数才能一直累加\n    private int hitCount;\n\n    // 初始化方法：实例创建后调用一次，适合放初始值\n    public void init() {\n        // 计数器清零，写在这里只执行一次\n        hitCount = 0;\n    }\n\n    // 处理 GET 请求；两个异常必须声明，少一个都编译不过\n    public void doGet(HttpServletRequest request, HttpServletResponse response)\n            throws ServletException, IOException {\n\n        // 告诉浏览器返回的是 UTF-8 的 HTML，防中文乱码\n        response.setContentType(\"text/html;charset=utf-8\");\n\n        // 取得输出流，用它往页面写内容\n        PrintWriter out = response.getWriter();\n\n        // 每访问一次加 1；因为是成员变量，所以是累加而不是每次从 1 开始\n        hitCount++;\n\n        // 把数字拼进 HTML 里输出\n        out.print(\"<h1>网站访问次数：\" + hitCount + \"<\/h1>\");\n    }\n\n    // 处理 POST 请求\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\n            throws ServletException, IOException {\n        // 表单是 POST 时也走同一套逻辑，直接转调 doGet\n        doGet(request, response);\n    }\n\n    // 销毁方法：服务器关闭或应用卸载时调用一次\n    public void destroy() {\n        // 在这里释放资源（真实项目是关连接、停线程、存统计）\n        System.out.println(\"Servlet销毁，释放资源\");\n    }\n}"

/* SDK 内联失败时的兜底：先试同目录 sdk.js，再试两个 CDN 镜像 */
function loadSdkFallback(){
  const urls = [
    "sdk.js",
    "https://unpkg.com/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js",
    "https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"
  ];
  return new Promise(resolve=>{
    let i = 0;
    const next = ()=>{
      if(window.WorkBuddyCloud) return resolve(true);
      if(i >= urls.length) return resolve(false);
      const s = document.createElement("script");
      let done = false;
      const finish = ()=>{
        if(done) return;
        done = true;
        if(window.WorkBuddyCloud) resolve(true); else next();
      };
      s.onload = finish;
      s.onerror = finish;
      s.src = urls[i++];
      document.head.appendChild(s);
      setTimeout(finish, 3500);
    };
    next();
  });
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* 出题时给选择题做一份副本：选项打乱重编号，正确答案跟着搬到新标号 */
function withOpts(q){
  if(!q || q.type!=="choice" || !q.options || q.options.length<2) return q;
  const KEYS = ["A","B","C","D","E","F"];
  const arr = q.options.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  const pos = arr.findIndex(o=>o.key===q.answer);
  return Object.assign({}, q, {
    options: arr.map((o,i)=>({key:KEYS[i], text:o.text, origin:o.key})),
    answer: pos>=0 ? KEYS[pos] : q.answer
  });
}
function norm(s){
  return String(s==null?"":s).toLowerCase()
    .replace(/[\s\u3000]/g,"").replace(/[`"'“”‘’]/g,"")
    .replace(/；/g,";").replace(/，/g,",").replace(/、/g,",")
    .replace(/\/>/g,">")            /* 自闭合写法等价：<x/> 与 <x> 视为同一个空 */
    .replace(/[。.]$/,"");
}
/* 填空判分统一入口：答案类空位常是标签/代码，容忍只写关键词与自闭合差异 */
function blankOk(user, ans){
  const nu = norm(user);
  if(!nu) return false;
  const nb = norm(ans);
  return nb === nu || (nb.indexOf(nu) >= 0 && nu.length >= 2);
}

    h += ansBox(q.answer==='√'?'正确':'错误', q.analysis);
  }else if(q.type==="blank"){
    h += `<div class="anl"><b>答案：</b>${q.blanks.map((b,i)=>`<b>${i+1}. ${esc(b)}</b>`).join("　")}</div>`;
    if(q.hint) h += `<div class="anl"><b>提醒：</b>${esc(q.hint)}</div>`;
  }else if(q.type==="short"){
    h += `<div class="anl" style="white-space:pre-wrap"><b>参考答案：</b>\n${esc(q.points.join("\n"))}</div>`;
    if(q.analysis) h += `<div class="anl"><b>关键词：</b>${esc(q.analysis)}</div>`;
  }else if(q.type==="app"){
    h += `<div class="muted" style="margin:4px 0 2px">先看带注释的完整代码，再遮住答案做下面的填空版。</div>`;
    h += `<details><summary>原代码（带注释）· ${q.code.length} 个文件</summary>` +
         q.code.map(c=>`<div class="muted" style="margin-top:8px">${esc(c.label)}</div><pre><code>${hlCode(c.text)}</code></pre>`).join("") +
         `</details>`;
    h += `<details><summary>填空版（自测）· ${q.answer.length} 个空</summary>` +
         q.blankCode.map(c=>`<div class="muted" style="margin-top:8px">${esc(c.label)}</div><pre><code>${hlCode(c.text)}</code></pre>`).join("") +
         `</details>`;
    h += `<details><summary>答案（${q.answer.length} 个空）</summary>${ansTable(q.answer)}</details>`;
    if(q.analysis) h += `<div class="anl" style="margin-top:10px"><b>易错点：</b>${esc(q.analysis)}</div>`;
  }
  return h;
}
function ansBox(v, a){
  let h = `<div class="ans"><div class="lb">正确答案</div><div class="v">${esc(v)}</div></div>`;
  if(a) h += `<div class="anl">${esc(a)}</div>`;

function ansTable(rows){

/* 应用题按空数分配分值：空多的题分值高，合计恒为 30 分（最大余数法保证整数） */
function allocAppScores(list, total){
  const w = list.map(q => Math.max(1, (q.answer ? q.answer.length : 0)));
  const sum = w.reduce((a,b)=>a+b,0);
  const raw = w.map(x => total * x / sum);
  const base = raw.map(x => Math.floor(x));
  let rest = total - base.reduce((a,b)=>a+b,0);
  const order = raw.map((x,i)=>({i, f:x-Math.floor(x)})).sort((a,b)=>b.f-a.f);
  for(let k=0; k<rest; k++) base[order[k % order.length].i] += 1;
  return base;
}

/* 从应用题里挑出 n 个空作为本题真正要填的空（1 空 1 分） */
function pickBlanks(q, n){
  const codes = q.answer.map(a=>a[0]);
  return shuffle(codes).slice(0, Math.min(n, codes.length));
}
/* 只保留指定的空，其余直接把答案填回代码里 */
function examCode(text, set, ansMap){
  return text.replace(/___\((\d+-\d+)\)___/g, (m, code)=> set.has(code) ? m : (ansMap.has(code) ? ansMap.get(code) : m));
}
function codeSetOf(item){
  return new Set(item && item.pick ? item.pick : []);
}

function buildPaper(){
  const pick = (arr,n)=>shuffle(arr).slice(0,n);
  const c = pick(ALL.filter(q=>q.type==="choice"),15).map(q=>({q:withOpts(q),score:2}));
  const j = pick(ALL.filter(q=>q.type==="judge"),10).map(q=>({q,score:1}));
  const b = pick(ALL.filter(q=>q.type==="blank"),5).map(q=>({q,score:2}));
  const s = pick(ALL.filter(q=>q.type==="short"),4).sort((x,y)=>x.no-y.no).map(q=>({q,score:5}));
  const appList = pick(ALL.filter(q=>q.type==="app"),4).sort((x,y)=>x.no-y.no);
  const appScore = allocAppScores(appList, 30);
  const a = appList.map((q,i)=>({q, score:appScore[i], pick:pickBlanks(q, appScore[i])}));
  return {items:[...c,...j,...b,...s,...a], t0:Date.now()};
}

    s = s.replace(/\{\{BLANK\}\}/g, ()=>`<input class="blankin" data-b="${idx}-${i++}" autocomplete="off" spellcheck="false">`);
  }
  return s;
}

function wrongOf(q){
  return { q_key:q.type+"-"+q.no, q_type:q.type, q_no:q.no, kp:q.kp||"",
           stem:(TNAME[q.type]||"题")+" "+q.no+" 题", wrong_count:1 };
}
function errMsg(e){
  let m = (e && e.message) ? String(e.message) : "网络异常";
  if(m.indexOf("<") >= 0) m = "请求被安全策略拦截，请稍后重试";
  return m.length > 80 ? m.slice(0,80)+"…" : m;
}

function submitPaper(){
  if(S.submitted) return;
  const unanswered = countUnanswered();
  if(unanswered>0 && !confirm(`还有 ${unanswered} 题未作答，确定交卷？`)) return;
  S.submitted = true;
  clearInterval(S.timer);
  const p = S.paper;
  const wrongItems = [];
  const correctKeys = [];

  let objGot = 0, objFull = 0, subFull = 0;
  p.items.forEach((it,idx)=>{
    const q = it.q;
    if(["choice","judge","blank"].includes(q.type)) objFull += it.score;
    else subFull += it.score;
  });

  p.items.forEach((it,idx)=>{
    const q = it.q;
    const box = $("pr"+idx);
    if(q.type==="choice"){
      const sel = S.ans["c"+idx];
      const ok = sel===q.answer;
      if(ok){ objGot += it.score; correctKeys.push(q.type+"-"+q.no); } else wrongItems.push(wrongOf(q));
      $("pa"+idx).querySelectorAll(".optbtn").forEach(el=>{
        const k = el.dataset.opt.split("-")[1];
        el.classList.remove("sel");
        if(k===q.answer) el.classList.add("ok");
        else if(k===sel) el.classList.add("no");
      });
      const optText = (q.options.find(o=>o.key===q.answer)||{}).text || "";
      const un = !sel;
      box.innerHTML = verdict(ok, it.score, un) + ansBox(q.answer + (optText? "．" + optText : ""), q.analysis);
    }else if(q.type==="judge"){
      const sel = S.ans["j"+idx];
      const ok = sel===q.answer;
      if(ok){ objGot += it.score; correctKeys.push(q.type+"-"+q.no); } else wrongItems.push(wrongOf(q));
      $("pa"+idx).querySelectorAll(".tfb").forEach(el=>{
        const v = el.dataset.tf.split("-")[1];
        el.classList.remove("sel");
        if(v===q.answer) el.classList.add("ok");
        else if(v===sel) el.classList.add("no");
      });
      box.innerHTML = verdict(ok, it.score, !sel) + ansBox(q.answer==='√'?'正确':'错误', q.analysis);
    }else if(q.type==="blank"){
      let right = 0;
      q.blanks.forEach((b,i)=>{
        const inp = document.querySelector(`.blankin[data-b="${idx}-${i}"]`);
        if(!inp) return;
        const ok = blankOk(inp.value, b);
        inp.classList.add(ok?"right":"wrong");
        if(ok) right++;
      });
      const all = right===q.blanks.length;
      const half = right>0;
      if(all){ objGot += it.score; correctKeys.push(q.type+"-"+q.no); }
      else if(half) objGot += it.score/2;
      if(!all) wrongItems.push(wrongOf(q));
      box.innerHTML = `<div class="anl"><b>答对 ${right}/${q.blanks.length} 个空${all?'（全对 +'+it.score+' 分）':(half?'（部分对 +'+(it.score/2)+' 分）':'')}</b></div>` +
        `<div class="anl"><b>答案：</b>${q.blanks.map((b,i)=>`<b>${i+1}. ${esc(b)}</b>`).join("　")}</div>` +
        (q.hint?`<div class="anl"><b>提醒：</b>${esc(q.hint)}</div>`:"");
    }else if(q.type==="short"){
      box.innerHTML = selfEval(idx, it.score) +
        `<div class="anl" style="white-space:pre-wrap"><b>参考答案：</b>\n${esc(q.points.join("\n"))}</div>` +
        (q.analysis?`<div class="anl"><b>关键词：</b>${esc(q.analysis)}</div>`:"");
    }else{
      const set = codeSetOf(it);
      const picked = q.answer.filter(a=>set.has(a[0]));
      box.innerHTML = selfEval(idx, it.score, "本题挖 " + picked.length + " 个空，1 空 1 分（全对 " + it.score + " 分）") +
        `<details><summary>原代码（带注释）</summary>` +
        q.code.map(c=>`<div class="muted" style="margin-top:8px">${esc(c.label)}</div><pre><code>${hlCode(c.text)}</code></pre>`).join("") +
        `</details>` +
        `<details open><summary>答案（本题 ${picked.length} 个空）</summary>${ansTable(picked)}</details>` +
        (q.analysis?`<div class="anl"><b>易错点：</b>${esc(q.analysis)}</div>`:"");
    }
  });

  const sb = $("submit"); if(sb){ sb.disabled = true; sb.textContent = "已交卷"; }
  S.objGot = objGot;

  S.recordId = null;
  S.result = { objGot, objFull, subFull, durationSec: Math.round((Date.now()-S.t0)/1000), wrongs: wrongItems, wrongsSaved: false };
  renderScore(objGot, objFull, subFull);
  bindSelfEval($("app"));      /* 题卡里的自评按钮在这里统一绑定 */
  markMastered(correctKeys);
  persistScore();
  window.scrollTo({top:0, behavior:"smooth"});
}

function countUnanswered(){
  let n = 0;
  S.paper.items.forEach((it,idx)=>{
    const q = it.q;
    if(q.type==="choice" && !S.ans["c"+idx]) n++;
    else if(q.type==="judge" && !S.ans["j"+idx]) n++;
    else if(q.type==="blank"){
      q.blanks.forEach((b,i)=>{ if(!norm(S.ans["b"+idx+"-"+i]||"")) n++; });
    }
  });
  return n;
}

function verdict(ok, score, un){
  if(un) return `<div class="anl" style="background:#f3f4f6;color:#6b7280"><b>— 未作答</b></div>`;
  return ok ? `<div class="anl" style="background:var(--ok-l);color:#0f7a3d"><b>✔ 答对了 +${score} 分</b></div>`
            : `<div class="anl" style="background:var(--no-l);color:#b91c1c"><b>✘ 答错了</b></div>`;
}

      <button data-v="0.5" data-s="${score/2}" class="half">一半 ${score/2} 分</button>

  area.innerHTML = `<div class="result" id="rescard">
    <div class="sc" id="tot">${Math.round(total*10)/10}<small> / 100</small></div>
    <div class="lv" id="lv">${lv}</div>
    <div class="brk">
      <div class="b">客观题 <b id="bo">${Math.round(objGot*10)/10} / ${objFull}</b></div>
      <div class="b">主观题自评 <b id="bs">${selfSum} / ${subFull}</b></div>
    </div>
    <div class="savehint" id="saveHint"></div>
  </div>`;

}

/* 自评按钮散落在各题卡（#pr{idx}）里，交卷后必须整页统一绑定，
   只扫成绩卡（#scoreArea）会一个都绑不到 —— 主观题 50 分将永远加不上 */
function bindSelfEval(root){
  (root || $("app")).querySelectorAll("[data-self]").forEach(box=>{
    box.querySelectorAll("button").forEach(btn=>{
      btn.onclick = ()=>{
        const idx = box.dataset.self;
        S.self[idx] = Number(btn.dataset.s);
        box.querySelectorAll("button").forEach(b=>b.classList.remove("on","ok","half","no"));
        btn.classList.add("on");
        if(btn.dataset.v==="1") btn.classList.add("ok");
        if(btn.dataset.v==="0.5") btn.classList.add("half");
        if(btn.dataset.v==="0") btn.classList.add("no");
        const sum = Object.values(S.self).reduce((a,b)=>a+b,0);
        const full = S.result ? S.result.subFull : 0;
        const t = (S.objGot||0) + sum;
        if($("tot")) $("tot").innerHTML = (Math.round(t*10)/10)+'<small> / 100</small>';
        if($("bs")) $("bs").textContent = sum+" / "+full;
        if($("lv")) $("lv").textContent = t>=90?"稳了，保持手感":t>=75?"不错，重点补错题":t>=60?"刚好及格，主观题再背一轮":"客观题还没过关，回题库刷一遍";
        if(btn.dataset.v==="1" && S.paper && S.paper.items[Number(idx)]){
          const q = S.paper.items[Number(idx)].q;
          markMastered([q.type+"-"+q.no]);
        }
        schedulePersist();
      };
    });
  });
}

/* ---------- 云服务：会话与登录 ---------- */
async function bootCloud(){
  if(!cloud){ render(); return; }
  const url = new URL(location.href);
  if(url.searchParams.has("code") || url.searchParams.has("error")){
    const provider = url.searchParams.get("provider");
    const fn = provider==="workbuddy" ? cloud.auth.handleWorkBuddyCallback
             : provider==="wechat"    ? cloud.auth.handleWechatWebCallback
             : null;
    try{
      if(typeof fn !== "function"){
        S.authMsg = "登录回调无效，请重新登录";
      }else{
        const r = await fn.call(cloud.auth);
        if(r.error) S.authMsg = r.error.message || "登录失败，请重试";
        else if(r.data) S.user = r.data.user || null;
      }
    }catch(e){ S.authMsg = "登录失败，请重试"; }
    for(const k of ["code","state","provider"]) url.searchParams.delete(k);
    history.replaceState(null, "", url.pathname + url.search + url.hash);
  }
  if(!S.user){
    try{
      const r = await cloud.auth.getSession();
      S.user = r && r.data && r.data.user ? r.data.user : null;
    }catch(e){ S.user = null; }
  }
  if(S.user) syncDrillFromCloud();
  // 加载瞬间可能还没恢复完会话，监听登录态变化补上（也会处理 token 刷新与退出）
  try{
    cloud.auth.onAuthStateChange((event, session)=>{
      const u = session && session.user ? session.user : null;
      const wasIn = !!S.user, isIn = !!u;
      const same = wasIn !== isIn ? false : (!wasIn || String(u.id) === String(S.user.id));
      if(same) return;
      S.user = u; S.records = null; S.wrongs = null; S.mastery = null;
      if(u && !wasIn) syncDrillFromCloud();     // 刚登录：把刷题进度接上云端
      render();
    });
  }catch(e){}
  render();
}

function setErr(id, msg){ const el = $(id); if(el) el.textContent = msg || ""; }

/* 验证码接口的报错多为上游英文原文（如 "send error code LimitExceeded.…"），
   统一翻译成人话，不把 code / msg 直接抛给用户 */
function otpErr(e){
  const raw = String((e && (e.message || (e.error && e.error.message))) || "");
  const code = String((e && (e.code || (e.error && e.error.code))) || "");
  const blob = (raw + " " + code).toLowerCase();
  if(/daily|per day|every day|daylimit/.test(blob)) return "该手机号今天收到的验证码已达上限，请明天再试";
  if(/per minute|per min|too many|frequent|throttl/.test(blob)) return "发送太频繁了，请等 1 分钟再试";
  if(/invalid.*(phone|mobile)|(phone|mobile).*invalid/.test(blob)) return "手机号格式不正确，请检查后重试";
  if(/limit|exceeded|quota/.test(blob)) return "验证码发送次数超限，请稍后再试";
  if(/network|timeout|fetch|offline/.test(blob)) return "网络异常，请检查网络后重试";
  return "验证码发送失败，请稍后重试";
}

function bindLogin(){
  const ph = $("iphone"), cd = $("icode");
  if(!ph) return;
  ph.addEventListener("input", ()=>setErr("perr",""));

  $("sendcode").onclick = async ()=>{
    const btn = $("sendcode");
    if(btn.disabled) return;
    const phone = ph.value.trim();
    if(!/^1\d{10}$/.test(phone)){ setErr("perr","请输入正确的 11 位手机号"); return; }
    setErr("perr",""); setErr("gerr","");
    btn.disabled = true; btn.textContent = "发送中…";
    let sent;
    try{ sent = await cloud.auth.sendOtp({ phone }); }
    catch(e){ sent = { error: e }; }
    if(sent.error){
      btn.disabled = false; btn.textContent = "获取验证码";
      setErr("gerr", otpErr(sent.error));
      return;
    }
    pendingOtp = { phone, verificationId: sent.data.verificationId, isExistingUser: sent.data.isExistingUser };
    setErr("gerr","验证码已发送，请查看短信");
    if(cd) cd.focus();
    let left = 60;
    btn.textContent = left + " s";
    const timer = setInterval(()=>{
      left--;
      const b = $("sendcode");
      if(!b){ clearInterval(timer); return; }
      if(left <= 0){ clearInterval(timer); b.disabled = false; b.textContent = "重新获取"; }
      else b.textContent = left + " s";
    }, 1000);
  };

  $("loginbtn").onclick = async ()=>{
    const phone = ph.value.trim(), code = cd.value.trim();
    if(!/^1\d{10}$/.test(phone)){ setErr("perr","请输入正确的 11 位手机号"); return; }
    if(!code){ setErr("gerr","请输入短信里收到的验证码"); return; }
    if(!pendingOtp || pendingOtp.phone !== phone){ setErr("gerr","请先点击「获取验证码」"); return; }
    const btn = $("loginbtn");
    btn.disabled = true; btn.textContent = "登录中…";
    let done;
    try{
      done = await cloud.auth.verifyOtp({
        phone: pendingOtp.phone,
        verificationId: pendingOtp.verificationId,
        isExistingUser: pendingOtp.isExistingUser,
        token: code
      });
    }catch(e){ done = { error: e }; }
    if(done.error){
      btn.disabled = false; btn.textContent = "登录 / 注册";
      setErr("gerr", (done.error && done.error.message) || "验证码不正确或已过期");
      return;
    }
    pendingOtp = null; S.authMsg = "";
    S.user = done.data.user; S.records = null; S.wrongs = null; S.mastery = null;
    syncDrillFromCloud();
    renderMe();
  };

  $("wxbtn").onclick = async ()=>{
    const back = new URL(location.href);
    back.pathname = "/";
    for(const k of ["code","state","provider"]) back.searchParams.delete(k);
    const btn = $("wxbtn");
    btn.disabled = true; btn.textContent = "正在跳转微信…";
    let r;
    try{ r = await cloud.auth.signInWithOAuth({ provider:"wechat", redirectTo: back.toString() }); }
    catch(e){ r = { error: e }; }
    if(r.error){
      btn.disabled = false; btn.textContent = "微信一键登录";
      setErr("gerr", (r.error && r.error.message) || "微信登录发起失败，请稍后重试");
      return;
    }
    location.assign(r.data.url);
  };
}

function fmtDate(d){
  if(!d || isNaN(d.getTime())) return "";
  const p = n => String(n).padStart(2,"0");
  return (d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function fmtDur(sec){
  const s = Number(sec)||0, m = Math.floor(s/60);
  return m>0 ? m+" 分 "+(s%60)+" 秒" : s+" 秒";
}

async function loadWrongs(){

async function loadCloud(){

      .select("id,total,obj_score,sub_score,obj_full,sub_full,question_count,duration_sec,created_at")

async function persistScore(){
  const R = S.result, hint = $("saveHint");
  if(!R || !cloud) return;
  if(!S.user){
    if(hint) hint.innerHTML = '这次成绩尚未保存 <a href="javascript:void(0)" id="toLogin">登录后可存入云端</a>';
    const tl = $("toLogin");
    if(tl) tl.onclick = ()=>{ S.tab = "me"; render(); window.scrollTo({top:0}); };
    return;
  }
  const subSum = Object.values(S.self).reduce((a,b)=>a+b,0);
  const objGot = Math.round(R.objGot*10)/10;
  const total  = Math.round((R.objGot + subSum)*10)/10;
  const payload = {
    owner_name: (S.user && S.user.name) || null,
    total: total,
    obj_score: objGot,
    sub_score: Math.round(subSum*10)/10,
    obj_full: R.objFull,
    sub_full: R.subFull,
    question_count: S.paper ? S.paper.items.length : 0,
    duration_sec: R.durationSec,
    detail: { items: (S.paper ? S.paper.items : []).map(it=>({ k: it.q.type+"-"+it.q.no, s: it.score })) }
  };
  if(hint) hint.textContent = "正在保存…";
  try{
    if(!S.recordId){
      const r = await cloud.database.from("exam_records").insert(payload).select();
      if(r.error) throw r.error;
      S.recordId = r.data && r.data[0] ? r.data[0].id : null;
    }else{
      const r = await cloud.database.from("exam_records").update(payload).eq("id", S.recordId).select();
      if(r.error) throw r.error;
      if(!r.data || !r.data.length) throw new Error("这条记录已不存在");
    }
    if(R.wrongs && R.wrongs.length && !R.wrongsSaved){
      const w = await cloud.database.rpc("record_wrong_questions", { p_items: R.wrongs });
      if(w.error) throw w.error;
      R.wrongsSaved = true;
    }
    S.records = null; S.wrongs = null;
    if(hint) hint.textContent = "✓ 已保存到云端，可在「我的」查看";
  }catch(e){
    if(hint) hint.textContent = "保存失败：" + errMsg(e);
  }
}
function schedulePersist(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(persistScore, 600);
}

/* 记住"做对了"：写入掌握表，题库进度条据此累加 */
async function markMastered(keys){
  if(!keys || !keys.length || !cloud || !S.user) return;
  const rows = keys.map(k=>({ q_key:k, q_type:k.split("-")[0] }));
  try{
    const r = await cloud.database.from("quiz_mastery")
      .upsert(rows, { onConflict:"owner_id,q_key", ignoreDuplicates:true });
    if(r.error) throw r.error;
  }catch(e){ /* 进度记录失败不打断做题 */ }
  if(Array.isArray(S.mastery)){
    const have = new Set(S.mastery.map(m=>m.q_key));
    rows.forEach(r=>{ if(!have.has(r.q_key)){ S.mastery.push(r); have.add(r.q_key); } });
    if(S.tab === "bank") renderBank();
  }
}

/* 错题重做交卷：做对的移出错题本，还错的累加次数 */
async function finishRedo(okKeys, stillWrong){
  const hint = ()=>$("saveHint");
  if(!cloud || !S.user){
    if(hint()) hint().textContent = "登录后重做的结果才会同步到云端";
    return;
  }
  if(hint()) hint().textContent = "正在同步…";
  try{
    if(okKeys.length){
      const d = await cloud.database.from("wrong_questions").delete().in("q_key", okKeys).select();
      if(d.error) throw d.error;
      if(!d.data || !d.data.length) throw new Error("错题本未更新");
    }
    if(stillWrong.length){
      const r = await cloud.database.rpc("record_wrong_questions", { p_items: stillWrong });
      if(r.error) throw r.error;
    }
    S.wrongs = null; S.records = null;
    if(hint()) hint().textContent = "✓ 已移出 " + okKeys.length + " 题"
      + (stillWrong.length ? "，剩下 " + stillWrong.length + " 题继续练" : "，错题本已清空");
  }catch(e){
    if(hint()) hint().textContent = "同步失败：" + errMsg(e);
  }
}

      <div class="muted">登录后，做对的题会在这里累加，换手机也能接着涨 <a href="javascript:void(0)" id="toMe2">去登录</a></div>
    </div>`;
  }
  if(S.mastery === null){
    loadProgress();

  }
  const order = [["choice","选择"],["judge","判断"],["blank","填空"],["short","简答"],["app","应用"]];
  const tot = {}, got = {};
  ALL.forEach(q=>{ tot[q.type] = (tot[q.type]||0) + 1; });
  (S.mastery||[]).forEach(m=>{ got[m.q_type] = (got[m.q_type]||0) + 1; });
  const allTot = ALL.length, allGot = Math.min((S.mastery||[]).length, allTot);
  const pct = allTot ? Math.round(allGot*100/allTot) : 0;
  let h = `<div class="card pad progcard">
    <div class="progtop"><b>掌握进度</b><span class="muted">${allGot} / ${allTot} 题 · ${pct}%</span></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>`;
  order.forEach(([k,label])=>{
    const t = tot[k]||0, g = Math.min(got[k]||0, t);
    const p = t ? Math.round(g*100/t) : 0;
    h += `<div class="prow"><span>${label}</span><div class="pbar"><i style="width:${p}%"></i></div><b>${g}/${t}</b></div>`;
  });
  h += `</div>`;
  return h;
}

function qByKey(k){
  const i = k.indexOf("-");
  if(i < 0) return null;
  const t = k.slice(0, i), n = k.slice(i+1);
  return ALL.find(x => x.type===t && String(x.no)===n) || null;
}

  if(S.wrongs === null && !S.wrongsLoading) loadWrongs();

  if(S.wrongErr){
    $("app").innerHTML = `<div class="card pad"><div class="err">${esc(S.wrongErr)}</div>
      <div class="btnrow"><button class="btn gray" id="wReload">重新加载</button></div></div>`;
    const b = $("wReload");
    if(b) b.onclick = ()=>{ S.wrongErr=""; S.wrongs=null; S.wrongsLoading=false; renderWrong(); };
    return;
  }
  if(S.wrongs === null){
    $("app").innerHTML = `<div class="card pad"><div class="muted">错题本读取中…</div></div>`;
    return;
  }

  const all = S.wrongs || [];
  if(!all.length){
    $("app").innerHTML = `<div class="card pad" style="text-align:center">
      <div style="font-size:38px;margin:12px 0 8px">🎉</div>
      <div style="font-size:15.5px;font-weight:700">错题本是空的</div>
      <div class="muted" style="margin-top:6px">去模考做一套，做错的题会自动收进来</div>
      <div class="btnrow"><button class="btn" id="wGo">去模考</button></div>
    </div>`;
    const b = $("wGo");
    if(b) b.onclick = ()=>{ S.tab="exam"; S.paper=null; render(); window.scrollTo({top:0}); };
    return;
  }

  const kps = ["全部"].concat(Array.from(new Set(all.map(w=>w.kp||"其他"))));
  const tps = ["全部"].concat(Array.from(new Set(all.map(w=>TNAME[w.q_type]||"题"))));
  const list = all.filter(w=>{
    if(S.wrongKp!=="全部" && (w.kp||"其他")!==S.wrongKp) return false;
    if(S.wrongType!=="全部" && (TNAME[w.q_type]||"题")!==S.wrongType) return false;
    return true;
  });

  let h = `<div class="card pad progcard">
    <div class="progtop"><b>错题本</b><span class="muted">共 ${all.length} 题</span></div>
    <div class="muted">模考做错的客观题自动收录，重做做对就移出</div>
  </div>
  <div class="chips">${kps.map(k=>`<div class="chip ${S.wrongKp===k?'on':''}" data-wkp="${esc(k)}">${esc(k)}</div>`).join("")}</div>
  <div class="chips">${tps.map(k=>`<div class="chip ${S.wrongType===k?'on':''}" data-wtype="${esc(k)}">${esc(k)}</div>`).join("")}</div>
  <div class="cnt"><span>${list.length} 题</span><span>${S.wrongKp}${S.wrongType!=="全部"?" · "+S.wrongType:""}</span></div>`;

  if(!list.length){
    h += `<div class="empty"><div class="e">🔍</div>这个筛选下没有错题</div>`;
  }else{
    h += `<div class="btnrow" style="margin:0 2px 10px"><button class="btn" id="redoList">重做这 ${list.length} 题</button></div>`;
    h += list.map(w=>{
      const q = qByKey(w.q_key);
      const open = S.wrongOpen[w.q_key] ? " open" : "";
      const full = (q ? String(q.stem) : String(w.stem||"")).replace(/\n/g," ");
      const plain = full.length>72 ? full.slice(0,72)+"…" : full;
      const short = esc(plain).replace(/\{\{BLANK\}\}/g, "____");
      return `<div class="q${open}" data-id="w-${w.q_key}">
        <div class="qh" data-wtoggle="${esc(w.q_key)}">
          <span class="tag ${TCLS[w.q_type]||""}">${T[w.q_type]||"题"}</span>
          <div class="qt"><span class="no">${w.q_no}.</span>${short}
            <div class="meta">${esc(w.kp||"")} · 累计错 ${w.wrong_count} 次 · 点开看答案</div>
          </div>
        </div>
        <div class="qb">${q ? qBody(q) : '<div class="muted">题库中未找到这道题</div>'}
          <div class="btnrow" style="margin-top:10px"><button class="btn gray" data-redo1="${esc(w.q_key)}">只重做这题</button></div>
        </div>
      </div>`;
    }).join("");
  }
  h += `<div class="foot">共 ${ALL.length} 题 · 错题会一直留在云端，直到你重做做对</div>`;
  $("app").innerHTML = h;
  bindWrong();
}

function bindWrong(){
  $("app").querySelectorAll("[data-wtoggle]").forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.wtoggle;
      S.wrongOpen[k] = !S.wrongOpen[k];
      el.closest(".q").classList.toggle("open");
    };
  });
  $("app").querySelectorAll("[data-wkp]").forEach(el=>{
    el.onclick = ()=>{ S.wrongKp = el.dataset.wkp; renderWrong(); window.scrollTo({top:0}); };
  });
  $("app").querySelectorAll("[data-wtype]").forEach(el=>{
    el.onclick = ()=>{ S.wrongType = el.dataset.wtype; renderWrong(); window.scrollTo({top:0}); };
  });
  const rl = $("redoList");
  if(rl) rl.onclick = ()=>{
    const keys = (S.wrongs||[]).filter(w=>{
      if(S.wrongKp!=="全部" && (w.kp||"其他")!==S.wrongKp) return false;
      if(S.wrongType!=="全部" && (TNAME[w.q_type]||"题")!==S.wrongType) return false;
      return true;
    }).map(w=>w.q_key);
    startRedo(keys);
  };
  $("app").querySelectorAll("[data-redo1]").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); startRedo([el.dataset.redo1]); };
  });
}

function bindMe(){
  const lo = $("logout");
  if(lo) lo.onclick = async ()=>{
    if(!confirm("退出登录？成绩记录仍保留在云端")) return;
    try{ await cloud.auth.signOut(); }catch(e){}
    S.user = null; S.records = null; S.wrongs = null; S.meErr = ""; S.authMsg = ""; S.mastery = null;
    renderMe();
  };
  const rl = $("reload");
  if(rl) rl.onclick = ()=>{ S.meErr = ""; S.records = null; S.wrongs = null; S.meLoading = false; renderMe(); };
  const tw = $("toWrong");
  if(tw) tw.onclick = ()=>{ S.tab = "wrong"; render(); window.scrollTo({top:0}); };
  $("app").querySelectorAll("[data-k]").forEach(el=>{
    el.onclick = ()=> jumpTo(el.dataset.k);
  });
}

function jumpTo(k){
  const i = k.indexOf("-");
  if(i < 0) return;
  S.kp = "全部"; S.type = "全部"; S.kw = ""; S.open[k] = true; S.tab = "bank";
  render();
  window.scrollTo({top:0});
  setTimeout(()=>{
    const el = document.querySelector('.q[data-id="'+k+'"]');
    if(el){ el.classList.add("open"); el.scrollIntoView({block:"center"}); }
  }, 80);
}

/* ---------- 刷题（一题一页，选完立刻判） ---------- */
const DRILL_TYPES = ["全部","选择","判断","填空"];
const KP_ORDER = ["全部","Web 基础","JSP","Servlet","JDBC","Spring","SpringMVC","MyBatis"];

/* ---------- 刷题进度存档：登录后只存云端，未登录才临时存本机 ---------- */
const DP_KEY = "jw_drill_progress_v1";
let drillCloudTimer = null, drillSyncing = false, _drillLocal = null;

function drillSnapshot(){
  const D = S.drill;
  if(!D) return null;
  return {
    kp: S.drillKp, type: S.drillType,
    keys: D.items.map(q=>q.type+"-"+q.no),
    idx: D.idx, res: D.res, total: D.items.length
  };
}

function loadDrillProgress(){
  try{
    const v = localStorage.getItem(DP_KEY);
    if(!v) return null;
    const o = JSON.parse(v);
    if(!o || !Array.isArray(o.keys) || !o.keys.length) return null;
    if((o.idx|0) >= o.keys.length) return null;          // 已刷完的直接作废
    return o;
  }catch(e){ return null; }
}

function saveDrillProgress(){
  const snap = drillSnapshot();
  if(!snap) return;
  if(S.drill && S.drill.mode==="redo") return;   // 错题重做是临时练，不写「继续刷」进度
  if(cloud && S.user){
    // 已登录：只写云端，本地不留副本
    try{ localStorage.removeItem(DP_KEY); }catch(e){}
    clearTimeout(drillCloudTimer);
    drillCloudTimer = setTimeout(()=>pushDrillCloud(snap), 900);
  }else{
    try{ localStorage.setItem(DP_KEY, JSON.stringify(snap)); }catch(e){}
  }
}

async function pushDrillCloud(snap){
  if(!cloud || !S.user || !snap) return;
  try{
    await cloud.database.rpc("save_drill_progress", { p: snap });
    S.drillSaved = Date.now();
  }catch(e){}
}

function clearDrillProgress(){
  try{ localStorage.removeItem(DP_KEY); }catch(e){}
  _drillLocal = null;
  if(cloud && S.user){
    clearTimeout(drillCloudTimer);
    try{ cloud.database.rpc("clear_drill_progress", {}); }catch(e){}
  }
}

/* 登录后把云端进度拉回本地（首次登录时把本机进度上传，之后清掉本机副本） */
async function syncDrillFromCloud(){
  if(!cloud || !S.user || drillSyncing) return;
  drillSyncing = true;
  try{
    const r = await cloud.database.from("drill_progress")
      .select("kp,q_type,q_keys,idx,res,total,updated_at").limit(1);
    const row = (r.data||[])[0];
    const local = loadDrillProgress();
    if(!row || !row.q_keys || !row.q_keys.length){
      if(local) await pushDrillCloud(local);           // 云端还没有，本机有的先传上去
    }else if(local && (local.idx|0) > (row.idx|0)){
      await pushDrillCloud(local);                     // 本机刷得更远，以本机为准
    }else{
      _drillLocal = { kp:row.kp, type:row.q_type, keys:row.q_keys,
                      idx:row.idx, res:row.res||{}, total:row.total };
    }
    if(cloud && S.user){ try{ localStorage.removeItem(DP_KEY); }catch(e){} }
    if(S.tab==="drill" && !S.drill) renderDrill();
  }catch(e){}
  drillSyncing = false;
}

function resumeDrill(){
  const o = _drillLocal || loadDrillProgress();
  if(!o) return;
  const items = o.keys.map(k=>qByKey(k)).filter(Boolean).map(withOpts);
  if(!items.length){ clearDrillProgress(); renderDrill(); return; }
  S.drillKp = o.kp || "全部";
  S.drillType = o.type || "全部";
  S.drill = { items: items, idx: Math.min(o.idx|0, items.length-1), res: o.res || {} };
  renderDrill();
  window.scrollTo({top:0});
}

function drillPool(){
  let list = ALL.filter(q=>["choice","judge","blank"].indexOf(q.type)>=0);
  if(S.drillKp!=="全部") list = list.filter(q=>q.kp===S.drillKp);
  if(S.drillType!=="全部") list = list.filter(q=>TNAME[q.type]===S.drillType);
  return list;
}

function renderDrill(){
  if(S.drill) return renderDrillQ();
  $("hdsub").textContent = "刷题 · 选完立刻判对错";
  const pool = drillPool();
  if(cloud && S.user && !_drillLocal && !drillSyncing) syncDrillFromCloud();
  const saved = _drillLocal || loadDrillProgress();
  let h = "";
  if(saved){
    const doneN = Object.keys(saved.res||{}).length;
    h += `<div class="card pad" style="border:1px solid var(--pri);background:var(--pri-l,#eef6ff)">
      <div class="progtop"><b>上次没刷完</b><span class="muted">已答 ${doneN} / ${saved.total} 题</span></div>
      <div class="muted" style="margin:6px 0 10px">${esc(saved.kp||"全部")} · ${esc(saved.type||"全部")} · 停在第 ${(saved.idx|0)+1} 题</div>
      <button class="btn block" id="dresume">继续刷（第 ${(saved.idx|0)+1} / ${saved.total} 题）</button>
    </div>`;
  }
  h += `<div class="card pad progcard">
    <div class="progtop"><b>${saved?"重新开始":"开始刷题"}</b><span class="muted">${pool.length} 题</span></div>
    <div class="muted">一页一道题，选完立刻判对错。做对的自动跳下一题；做错的当场给正确答案和解析，并收进错题本。${saved?"开始新一轮会覆盖上面的进度。":"退出或关掉页面，进度都会保留。"}</div>
  </div>
  <div class="chips">${KP_ORDER.map(k=>`<div class="chip ${S.drillKp===k?'on':''}" data-dkp="${esc(k)}">${esc(k)}</div>`).join("")}</div>
  <div class="chips">${DRILL_TYPES.map(k=>`<div class="chip ${S.drillType===k?'on':''}" data-dt="${k}">${k}</div>`).join("")}</div>
  <div class="btnrow" style="margin-top:4px"><button class="btn block${saved?" gray":""}" id="dstart">${saved?"重新开始新的一轮":`开始刷题（${pool.length} 题）`}</button></div>
  <div class="foot">刷题只覆盖客观题（选择 / 判断 / 填空）· 简答和应用题到「模考」练</div>`;
  $("app").innerHTML = h;
  $("app").querySelectorAll("[data-dkp]").forEach(el=>el.onclick=()=>{ S.drillKp = el.dataset.dkp; renderDrill(); });
  $("app").querySelectorAll("[data-dt]").forEach(el=>el.onclick=()=>{ S.drillType = el.dataset.dt; renderDrill(); });
  const rs = $("dresume"); if(rs) rs.onclick = resumeDrill;
  const st = $("dstart"); if(st) st.onclick = startDrill;
}

function startDrill(){
  const pool = drillPool();
  if(!pool.length){ alert("这个范围里没有题，换个筛选试试"); return; }
  clearDrillProgress();
  S.drill = { items: shuffle(pool).map(withOpts), idx:0, res:{} };
  saveDrillProgress();
  renderDrill();
  window.scrollTo({top:0});
}

function drillStem(q){
  let s = esc(q.stem).replace(/\n/g,"<br>");
  if(q.type==="blank"){
    let i = 0;
    s = s.replace(/\{\{BLANK\}\}/g, ()=>`<input class="blankin" data-bi="${i++}" autocomplete="off" spellcheck="false">`);
  }
  return s;
}

function drillBody(q, r){
  /* 恢复进度时选项已重新打乱，用原始标号把「当时选的那项」找回来（判断题没有 options，要挡一下） */
  const selKey = !r ? null
    : (r.selOrigin && q.options)
      ? (((q.options.find(o=>o.origin===r.selOrigin)||{}).key) || r.sel)
      : r.sel;
  if(q.type==="choice"){
    return `<div class="opts" style="margin-top:10px">` + q.options.map(o=>{
      let cls = "optbtn";
      if(r){ cls += " dis"; if(o.key===q.answer) cls += " ok"; else if(o.key===selKey) cls += " no"; }
      return `<div class="${cls}" data-opt="${esc(o.key)}"><span class="k">${esc(o.key)}</span><span>${esc(o.text)}</span></div>`;
    }).join("") + `</div>`;
  }
  if(q.type==="judge"){
    return `<div class="tf" style="margin-top:10px">` + ["√","×"].map(k=>{
      let cls = "tfb";
      if(r){ if(k===q.answer) cls += " ok"; else if(k===r.sel) cls += " no"; }
      return `<div class="${cls}" data-opt="${k}">${k==="√" ? "√ 正确" : "× 错误"}</div>`;
    }).join("") + `</div>`;
  }
  if(q.type==="blank"){
    if(r) return "";
    return `<div class="btnrow" style="margin-top:12px"><button class="btn block" id="dsub">提交答案</button></div>`;
  }
  return "";
}

function drillFb(q, r){
  if(!r) return "";
  if(r.ok){
    return `<div class="anl" style="background:var(--ok-l);color:#0f7a3d"><b>✔ 答对了</b>${r.ms ? " · "+esc(r.ms) : ""}</div>`;
  }
  let h = `<div class="anl" style="background:var(--no-l);color:#b91c1c"><b>✘ 答错了</b>${r.ms ? " · "+esc(r.ms) : ""}</div>`;
  if(q.type==="choice"){
    const opt = (q.options.find(o=>o.key===q.answer)||{}).text || "";
    h += `<div class="ans"><div class="lb">正确答案</div><div class="v">${esc(q.answer)}${opt ? "．"+esc(opt) : ""}</div></div>`;
  }else if(q.type==="judge"){
    h += `<div class="ans"><div class="lb">正确答案</div><div class="v">${q.answer==="√" ? "正确" : "错误"}</div></div>`;
  }else if(q.type==="blank"){
    h += `<div class="ans"><div class="lb">正确答案</div><div class="v">${q.blanks.map((b,i)=>`${i+1}. ${esc(b)}`).join("　")}</div></div>`;
  }
  if(q.analysis) h += `<div class="anl"><b>解析：</b>${esc(q.analysis)}</div>`;
  if(q.hint) h += `<div class="anl"><b>提醒：</b>${esc(q.hint)}</div>`;
  h += S.user
    ? `<div class="anl" style="background:#f3f4f6;color:#6b7280">已收进错题本，可以到「错题」重做</div>`
    : `<div class="anl" style="background:#f3f4f6;color:#6b7280">登录后会自动收集错题，可到「错题」重做</div>`;
  return h;
}

function renderDrillQ(){
  const D = S.drill;
  if(!D) return renderDrill();
  if(D.idx >= D.items.length) return renderDrillDone();
  const q = D.items[D.idx], r = D.res[D.idx], n = D.items.length;
  const doneN = Object.keys(D.res).length;
  const okN = Object.keys(D.res).filter(k=>D.res[k].ok).length;
  const pct = Math.round((D.idx + (r?1:0)) * 100 / n);

  const isRedo = D.mode === "redo";
  let h = `<div class="exhd">
    <div><div class="t">${isRedo ? "错题重做 · " : ""}${TNAME[q.type]} · ${esc(q.kp)}</div>
      <div class="s">第 ${D.idx+1} / ${n} 题${isRedo ? " · 答对即移出错题本" : ""}</div></div>
    <button class="linkbtn" id="dquit">退出</button>
  </div>
  <div class="dprog"><i style="width:${pct}%"></i></div>
  <div class="dstat"><span>已答 <b>${doneN}</b></span><span>答对 <b>${okN}</b></span><span>答错 <b>${doneN-okN}</b></span></div>
  <div class="card pad" style="margin-top:12px">
    <div class="pstem">${drillStem(q)}</div>
    ${drillBody(q, r)}
  </div>
  ${drillFb(q, r)}
  <div class="btnrow">
    <button class="btn gray" id="dprev"${D.idx===0 ? " disabled" : ""}>上一题</button>
    <button class="btn" id="dnext">${D.idx===n-1 ? "看结果" : "下一题"}</button>
  </div>
  <div class="foot">做对自动跳下一题 · 做错的题会进错题本</div>`;
  $("app").innerHTML = h;
  bindDrillQ(q, r);
}

function bindDrillQ(q, r){
  const idx = S.drill.idx;
  $("dquit").onclick = ()=>{
    if(S.drill && S.drill.mode === "redo"){        // 错题重做：退出直接回错题本
      S.drill = null; S.tab = "wrong"; S.wrongs = null;
      render(); window.scrollTo({top:0});
      return;
    }
    const snap = drillSnapshot();
    if(snap) _drillLocal = snap;        // 首页立刻就能显示「继续刷」，不必等云端返回
    saveDrillProgress();
    S.drill = null;
    renderDrill();
    window.scrollTo({top:0});
  };
  $("dprev").onclick = ()=>{
    if(!S.drill || S.drill.idx===0) return;
    S.drill.idx--; saveDrillProgress(); renderDrillQ(); window.scrollTo({top:0});
  };
  $("dnext").onclick = ()=>drillNext(idx);

  if(!r){
    $("app").querySelectorAll("[data-opt]").forEach(el=>{
      el.onclick = ()=>answerDrill(q, idx, el.dataset.opt);
    });
    const sb = $("dsub");
    if(sb) sb.onclick = ()=>submitDrillBlank(q, idx);
  }else if(q.type==="blank"){
    q.blanks.forEach((b,i)=>{
      const inp = document.querySelector('.blankin[data-bi="'+i+'"]');
      if(!inp) return;
      inp.value = (r.vals && r.vals[i]) || "";
      inp.disabled = true;
      if(r.per) inp.classList.add(r.per[i] ? "right" : "wrong");
    });
  }
}

function answerDrill(q, idx, key){
  if(!S.drill || S.drill.idx!==idx || S.drill.res[idx]) return;
  const ok = key === q.answer;
  const picked = (q.options || []).find(o=>o.key===key) || {};
  S.drill.res[idx] = { ok:ok, sel:key, selOrigin: picked.origin || key };
  handleDrillResult(q, ok);
  saveDrillProgress();
  renderDrillQ();
  if(ok) drillAuto(idx);
}

/* 答对/答错后的统一处理：掌握度、错题本增删 */
function handleDrillResult(q, ok){
  const key = q.type+"-"+q.no;
  if(ok){
    markMastered([key]);
    if(S.drill && S.drill.mode==="redo"){
      S.drill.out = (S.drill.out||0) + 1;
      removeWrongOne(key);
    }
  }else{
    recordDrillWrong(q);
  }
}

function submitDrillBlank(q, idx){
  if(!S.drill || S.drill.idx!==idx || S.drill.res[idx]) return;
  const vals = [], per = [];
  let right = 0;
  q.blanks.forEach((b,i)=>{
    const inp = document.querySelector('.blankin[data-bi="'+i+'"]');
    const v = inp ? inp.value : "";
    vals.push(v);
    const ok = blankOk(v, b);
    per.push(ok);
    if(ok) right++;
  });
  const all = right === q.blanks.length;
  S.drill.res[idx] = { ok:all, right:right, total:q.blanks.length, vals:vals, per:per, ms:"答对 "+right+"/"+q.blanks.length+" 个空" };
  handleDrillResult(q, all);
  saveDrillProgress();
  renderDrillQ();
  if(all) drillAuto(idx);
}

function drillAuto(from){
  setTimeout(()=>{
    if(!S.drill || S.drill.idx!==from || !S.drill.res[from]) return;
    drillNext(from);
  }, 750);
}

function drillNext(from){
  if(!S.drill || S.drill.idx!==from) return;
  S.drill.idx++;
  if(S.drill.idx >= S.drill.items.length) renderDrillDone();
  else { saveDrillProgress(); renderDrillQ(); window.scrollTo({top:0}); }
}

function renderDrillDone(){
  const D = S.drill;
  const isRedo = D && D.mode === "redo";
  if(!isRedo) clearDrillProgress();
  const n = D.items.length;
  const keys = Object.keys(D.res);
  const doneN = keys.length;
  const okN = keys.filter(k=>D.res[k].ok).length;
  if(isRedo){
    const left = n - okN;
    $("hdsub").textContent = "错题重做结束";
    $("app").innerHTML = `<div class="result">
      <div class="sc">${okN}<small> / ${n}</small></div>
      <div class="lv">${left ? "答对的已移出错题本，还剩 "+left+" 题要再练" : "本轮错题全部拿下，错题本已清空"}</div>
      <div class="brk">
        <div class="b">本轮题数 <b>${n}</b></div>
        <div class="b">答对移出 <b>${okN}</b></div>
        <div class="b">仍需练 <b>${left}</b></div>
      </div>
    </div>
    <div class="btnrow"><button class="btn" id="dtowrong">回错题本</button></div>
    ${left ? `<div class="btnrow"><button class="btn gray" id="dredoLeft">再练剩下的 ${left} 题</button></div>` : ""}
    <div class="foot">答对的题已自动从错题本移出</div>`;
    $("dtowrong").onclick = ()=>{ S.drill = null; S.tab = "wrong"; S.wrongs = null; render(); window.scrollTo({top:0}); };
    const rl = $("dredoLeft");
    if(rl) rl.onclick = ()=>{
      const bad = keys.filter(k=>!D.res[k].ok).map(k=>D.items[+k]).filter(Boolean).map(q=>q.type+"-"+q.no);
      S.drill = null;
      startRedo(bad);
    };
    return;
  }
  const rate = doneN ? Math.round(okN*100/doneN) : 0;
  const lv = rate>=90 ? "很稳，保持这个手感" : rate>=75 ? "不错，错的那几道再过一遍" : rate>=60 ? "刚过及格线，建议重刷错题" : "基础还不牢，先去「知识」把要点过一遍";
  $("hdsub").textContent = "刷题结束";
  $("app").innerHTML = `<div class="result">
    <div class="sc">${okN}<small> / ${doneN}</small></div>
    <div class="lv">正确率 ${rate}% · ${lv}</div>
    <div class="brk">
      <div class="b">本轮题数 <b>${n}</b></div>
      <div class="b">已作答 <b>${doneN}</b></div>
      <div class="b">答对 <b>${okN}</b></div>
      <div class="b">答错 <b>${doneN-okN}</b></div>
    </div>
  </div>
  <div class="btnrow"><button class="btn" id="dagain">再刷一组</button></div>
  <div class="btnrow"><button class="btn gray" id="dtowrong">去错题本</button></div>
  <div class="foot">${S.user ? "本轮做错的题已收进错题本" : "未登录，本轮错题不会被保存；登录后可自动收集"}</div>`;
  $("dagain").onclick = ()=>{ S.drill = null; startDrill(); };
  $("dtowrong").onclick = ()=>{ S.drill = null; S.tab = "wrong"; S.wrongs = null; render(); window.scrollTo({top:0}); };
}

async function recordDrillWrong(q){
  if(!cloud || !S.user) return;
  try{ await cloud.database.rpc("record_wrong_questions", { p_items:[wrongOf(q)] }); }catch(e){}
  S.wrongs = null;
}

/* ---------- 知识点 ---------- */

function kpMastered(){
  const m = {};
  if(!Array.isArray(S.mastery)) return null;
  S.mastery.forEach(x=>{ const q = qByKey(x.q_key); if(q) m[q.kp] = (m[q.kp]||0)+1; });
  return m;
}

function renderKb(){
  if(S.kbSel){ renderKbDetail(S.kbSel); return; }
  $("hdsub").textContent = "知识点 · 系统过一遍";
  const got = kpMastered();
  const cnt = {};
  ALL.forEach(q=>{ cnt[q.kp] = (cnt[q.kp]||0)+1; });
  let h = `<div class="card pad progcard">
    <div class="progtop"><b>七个模块</b><span class="muted">共 ${POINTS.length} 个知识点</span></div>
    <div class="muted">先看要点建立框架，再去刷题检验；每个知识点都能直接跳到对应的题</div>
  </div>`;
  h += POINTS.map(p=>{
    const total = cnt[p.k]||0;
    const m = got ? (got[p.k]||0) : null;
    return `<div class="card kbcard" data-kb="${esc(p.k)}">
      <div class="h"><h3>${esc(p.k)}</h3><span class="muted">${total} 题</span></div>
      <div class="d">${esc(p.desc)}</div>
      <div class="m">${p.items.length} 个要点${p.pits&&p.pits.length ? " · "+p.pits.length+" 个易错点" : ""}${m!==null ? " · 已掌握 "+m+"/"+total : ""}</div>
    </div>`;
  }).join("");
  h += `<div class="foot">知识库按七章整理 · 与题库的题目一一对应</div>`;
  $("app").innerHTML = h;
  $("app").querySelectorAll("[data-kb]").forEach(el=>{
    el.onclick = ()=>{ S.kbSel = el.dataset.kb; render(); window.scrollTo({top:0}); };
  });
}

function renderKbDetail(k){
  const p = POINTS.find(x=>x.k===k);
  if(!p){ S.kbSel = null; return renderKb(); }
  const total = ALL.filter(q=>q.kp===k).length;
  const objTotal = ALL.filter(q=>q.kp===k && ["choice","judge","blank"].indexOf(q.type)>=0).length;
  const got = kpMastered();
  $("hdsub").textContent = k + " · 知识点";
  let h = `<button class="linkbtn" id="kbback">← 全部知识点</button>
  <div class="card pad">
    <h3 style="font-size:16px;font-weight:700">${esc(p.k)}</h3>
    <div class="muted" style="margin-top:6px">${esc(p.desc)}</div>
    ${p.items.map((it,i)=>`<div class="pt"><div class="n">${i+1}</div>
      <div><div class="t">${esc(it.t)}</div><div class="d">${esc(it.d)}</div></div></div>`).join("")}
    ${p.pits && p.pits.length ? `<div class="pit"><b>容易踩的坑</b><ul>${p.pits.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  </div>
  <div class="btnrow"><button class="btn block" id="kbpractice">刷这 ${objTotal} 题</button></div>
  <div class="btnrow"><button class="btn gray" id="kbbank">在题库里展开看全部 ${total} 题</button></div>
  <div class="foot">${got ? "已掌握 "+(got[k]||0)+" / "+total : "登录后可以看到这个模块的掌握情况"}</div>`;
  $("app").innerHTML = h;
  $("kbback").onclick = ()=>{ S.kbSel = null; render(); window.scrollTo({top:0}); };
  $("kbpractice").onclick = ()=>{
    S.drillKp = k; S.drillType = "全部"; S.drill = null; S.tab = "drill";
    render(); startDrill(); window.scrollTo({top:0});
  };
  $("kbbank").onclick = ()=>{ S.kp = k; S.type = "全部"; S.kw = ""; S.tab = "bank"; render(); window.scrollTo({top:0}); };
}

/* ---------- 路由 ---------- */
function render(){
  clearInterval(S.timer); S.timer = null;
  if(S.tab==="bank"){ $("hdsub").textContent = "选择 62 · 判断 45 · 填空 27 · 简答 8 · 应用 5"; renderBank(); }
  else if(S.tab==="drill"){ renderDrill(); }
  else if(S.tab==="exam"){ renderExamHome(); }
  else if(S.tab==="wrong"){ renderWrong(); }
  else if(S.tab==="kb"){ renderKb(); }
  else { renderMe(); }
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===S.tab));
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    if(S.tab==="exam" && S.paper && !S.submitted && !confirm("离开会丢失当前作答，确定？")) return;
    if(S.tab==="drill" && S.drill){
      if(S.drill.mode === "redo"){ S.drill = null; }   // 错题重做不写「继续刷」进度
      else{
        const snap = drillSnapshot();
        if(snap) _drillLocal = snap;      // 切走时留在内存，切回来能直接接着刷
        saveDrillProgress();
      }
    }
    S.tab = t.dataset.tab;
    if(S.tab==="exam"){ S.paper = null; S.ans={}; S.self={}; S.submitted=false; S.mode="exam"; }
    render();
    window.scrollTo({top:0});
  };
});
bootCloud();

/* ---------- 云服务连通性自检（仅 ?diag=1 时运行） ---------- */
async function runDiag(){
  const box = document.createElement("pre");
  box.id = "diagbox";
  box.style.cssText = "position:fixed;left:0;top:0;right:0;z-index:9999;background:#0b1020;color:#7ef7a4;"
    + "font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:8px;max-height:70vh;overflow:auto;white-space:pre-wrap";
  document.body.appendChild(box);
  const log = s => { box.textContent += s + "\n"; };
  log("cloud-init: " + (cloud ? "ok" : "FAIL " + cloudErr));
  if(!cloud) return;
  try{
    const s = await cloud.auth.getSession();
    log("session: " + (s.data ? "signed-in" : "none") + (s.error ? " err=" + s.error.message : ""));
  }catch(e){ log("session: THREW " + e.message); }
  try{
    const r = await cloud.database.from("exam_records").select("id,total").limit(1);
    log("select exam_records: err=" + (r.error ? ((r.error.code||"") + " " + r.error.message) : "null") + " rows=" + (r.data ? r.data.length : "-"));
  }catch(e){ log("select: THREW " + e.message); }
  try{
    const r = await cloud.database.from("exam_records").insert({ total: 1, obj_score: 1, sub_score: 0, obj_full: 1, sub_full: 0, question_count: 1 });
    log("insert anon: err=" + (r.error ? ((r.error.code||"") + " " + r.error.message) : "null") + " rows=" + (r.data ? r.data.length : "-"));
    if(!r.error && r.data && r.data.length){
      const d = await cloud.database.from("exam_records").delete().eq("id", r.data[0].id).select();
      log("cleanup: err=" + (d.error ? d.error.message : "null") + " rows=" + (d.data ? d.data.length : "-"));
    }
  }catch(e){ log("insert: THREW " + e.message); }
  try{
    const r = await cloud.database.rpc("record_wrong_questions", { p_items: [{ q_key:"diag-1", q_type:"choice", q_no:1, kp:"diag", stem:"diag", wrong_count:1 }] });
    log("rpc record_wrong_questions: err=" + (r.error ? ((r.error.code||"") + " " + r.error.message) : "null") + " out=" + JSON.stringify(r.data));
  }catch(e){ log("rpc: THREW " + e.message); }
  log("done");
}
if(new URL(location.href).searchParams.get("diag") === "1") setTimeout(runDiag, 500);
