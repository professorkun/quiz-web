name: general-ci

# web-v2 应用检查轨：TypeScript、边界与扩展点、构建、Vitest。
# 空壳化后旧版静态站与 legacy-ci 已移除，本工作流是唯一 CI。
#
# 步骤拆分而非直接调 `pnpm verify`，是为了让每一步的失败在 Actions 上一眼可辨；
# 下列步骤合起来等价于 web-v2 的 `pnpm verify`（check:boundaries → check:extension →
# build → test）。静态检查由 `typecheck` 承担。
#
# 注意顺序：仓库内包之间通过 `dist/*.d.ts` 解析（package.json 的 types 指向 dist），
# 所以 `build` 必须排在 `typecheck` 之前——干净的 checkout 上没有 dist，
# 先 typecheck 会以 TS2307「找不到 @quiz/core」失败。

on:
  push:
    branches: [main, general-dev, integrate/s7-e8, chore/s6-closeout]
  pull_request:
    branches: [main, general-dev, integrate/s7-e8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  general:
    name: general
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web-v2

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          # jsdom@31 → undici@8 声明 engines: node >=22.19.0，
          # Node 20 上 zstd 解压 API 缺失，测试会以 undefined.bind 崩溃。
          node-version: "22"

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: TypeScript 检查
        run: pnpm typecheck

      - name: 边界与扩展点检查
        run: |
          pnpm check:boundaries
          pnpm check:extension

      - name: 单元测试
        run: pnpm test
